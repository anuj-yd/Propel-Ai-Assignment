version: '3.8'

services:
  mongodb:
    image: mongo:6
    container_name: propel_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    container_name: propel_backend
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/propel_ai
      - PORT=5000
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    depends_on:
      - mongodb

  frontend:
    build: ./frontend
    container_name: propel_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongo_data:
